name: Marginal
options:
  bundleIdPrefix: software.tactile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "2"
    GENERATE_INFOPLIST_FILE: YES
packages:
  ReaderCore:
    path: Packages/ReaderCore
  ReaderStore:
    path: Packages/ReaderStore
  ReaderBackup:
    path: Packages/ReaderBackup
  GoogleDriveKit:
    path: Packages/GoogleDriveKit
  S3Kit:
    path: Packages/S3Kit
targets:
  Marginal:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: ReaderCore
      - package: ReaderStore
      - package: ReaderBackup
      - package: GoogleDriveKit
      - package: S3Kit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.tactile.marginal
        # Empty unless Config/Local.xcconfig names an entitlements file (the iCloud container
        # backup destination); see Config/Signing.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(MARGINAL_ENTITLEMENTS)
        PRODUCT_NAME: Marginal
        # App/Info.plist (generated by XcodeGen from `info:` below) is complete; letting Xcode also
        # generate keys would overwrite CFBundleName with the product name.
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tactile Texts
        CFBundleName: Tactile Texts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Files only lists an app under a file's "Open With" (and opens a tapped file in its
        # owning app) when the app accepts the file where it is. The app still copies what it
        # keeps: a PDF is imported into the library and a backup is only read for restore, so
        # the reader's file is never modified or deleted. A file sent through the share sheet
        # still arrives as a copy in the app's Inbox; both forms are handled.
        LSSupportsOpeningDocumentsInPlace: true
        NSUserActivityTypes:
          - software.tactile.marginal.openBook
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: Tactile Texts Backup
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - software.tactile.marginal.backup
        # A backup archive (`.ttbackup`): a ZIP by content, declared as plain data so Files hands
        # it to the app instead of unpacking it. Same identifier and extension as
        # `BackupFormat` in Packages/ReaderBackup.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: software.tactile.marginal.backup
            UTTypeDescription: Tactile Texts Backup
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ttbackup
        # Automatic backups run in a background processing task.
        BGTaskSchedulerPermittedIdentifiers:
          - software.tactile.marginal.backup
        UIBackgroundModes:
          - processing
        # The app's iCloud container, shown in Files as "Tactile Texts". Has no effect without
        # the iCloud entitlement (MARGINAL_ENTITLEMENTS).
        NSUbiquitousContainers:
          iCloud.software.tactile.marginal:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Tactile Texts
            NSUbiquitousContainerSupportedFolderLevels: Any
        # The OAuth client ID of the direct Google Drive integration; empty when not set up.
        GoogleDriveClientID: $(GOOGLE_DRIVE_CLIENT_ID)
        # The developer's S3-compatible backup destination (for example Cloudflare R2); every
        # value is empty when not set up. These are build-time secrets from the git-ignored
        # Config/Local.xcconfig and are readable in the built app: see Config/Signing.xcconfig.
        S3Backup:
          Host: $(S3_BACKUP_HOST)
          Region: $(S3_BACKUP_REGION)
          Bucket: $(S3_BACKUP_BUCKET)
          AccessKeyID: $(S3_BACKUP_ACCESS_KEY_ID)
          SecretAccessKey: $(S3_BACKUP_SECRET_ACCESS_KEY)
          Prefix: $(S3_BACKUP_PREFIX)
          DisplayName: $(S3_BACKUP_NAME)
        # The Tactile Texts cloud backup service: its host (no scheme) and the App Store
        # subscription product IDs, comma-separated. Not secrets. Both empty by default, which
        # leaves the service out of the app; see Config/Signing.xcconfig.
        BackupService:
          Host: $(BACKUP_SERVICE_HOST)
          ProductIDs: $(BACKUP_PRODUCT_IDS)
  MarginalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      # The StoreKit configuration, for the tests' SKTestSession (not shipped in the app).
      - path: Config/Marginal.storekit
        buildPhase: resources
    dependencies:
      - target: Marginal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.tactile.marginal.tests
  MarginalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Marginal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.tactile.marginal.uitests
schemes:
  Marginal:
    build:
      targets:
        Marginal: all
    # Purchases in a Run from Xcode use the local StoreKit configuration, so the backup
    # subscription can be bought in the simulator with no App Store account.
    run:
      storeKitConfiguration: Config/Marginal.storekit
    test:
      targets:
        - MarginalTests
        - MarginalUITests
