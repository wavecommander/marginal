name: TactileTexts
options:
  bundleIdPrefix: software.tactile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "2"
    GENERATE_INFOPLIST_FILE: YES
packages:
  ReaderCore:
    path: Packages/ReaderCore
  ReaderStore:
    path: Packages/ReaderStore
  ReaderBackup:
    path: Packages/ReaderBackup
  S3Kit:
    path: Packages/S3Kit
targets:
  TactileTexts:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: ReaderCore
      - package: ReaderStore
      - package: ReaderBackup
      - package: S3Kit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.tactile.texts
        # Empty unless Config/Local.xcconfig names an entitlements file; see
        # Config/Signing.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(TACTILE_ENTITLEMENTS)
        PRODUCT_NAME: TactileTexts
        # App/Info.plist (generated by XcodeGen from `info:` below) is complete; letting Xcode also
        # generate keys would overwrite CFBundleName with the product name.
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # The "Stamp Build Info" phase below runs git on the checkout and edits the built
        # Info.plist, neither of which a sandboxed script phase may do.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Writes the branch, commit and build time into the built Info.plist (`TactileTextsBuild`) for
    # Settings ▸ About. Runs on every build; the committed App/Info.plist is not touched.
    postBuildScripts:
      - name: Stamp Build Info
        script: '"$SRCROOT/scripts/stamp-build-info.sh"'
        basedOnDependencyAnalysis: false
        # The processed Info.plist is this phase's input, so the build system always runs it
        # after "Process Info.plist"; without it an incremental build could stamp first and
        # have the stamp overwritten.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tactile Texts
        CFBundleName: Tactile Texts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Files only lists an app under a file's "Open With" (and opens a tapped file in its
        # owning app) when the app accepts the file where it is. The app still copies what it
        # keeps: a PDF is imported into the library and a backup is only read for restore, so
        # the reader's file is never modified or deleted. A file sent through the share sheet
        # still arrives as a copy in the app's Inbox; both forms are handled.
        LSSupportsOpeningDocumentsInPlace: true
        NSUserActivityTypes:
          - software.tactile.texts.openBook
        # "Open in" for every format the app imports (docs/FORMAT_IMPORT_PLAN.md, "Formats").
        # The types are `ImportFormat.typeIdentifiers` in Packages/ReaderCore (the one list of
        # importable formats); Tests/ImportFormatCatalogTests.swift fails when the two disagree.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: EPUB Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
          - CFBundleTypeName: Comic Book Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - software.tactile.texts.cbz
              - public.zip-archive
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
          - CFBundleTypeName: Text Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - net.daringfireball.markdown
              - public.html
              - public.xhtml
              - com.apple.webarchive
          - CFBundleTypeName: Word Processing Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.wordprocessingml.document
              - com.microsoft.word.doc
              - org.openxmlformats.wordprocessingml.document.macroenabled
              - org.openxmlformats.wordprocessingml.template
              - com.microsoft.word.dot
              - public.rtf
              - com.apple.iwork.pages.sffpages
              - com.apple.iwork.pages.pages
          - CFBundleTypeName: Presentation
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.presentationml.presentation
              - com.microsoft.powerpoint.ppt
              - org.openxmlformats.presentationml.presentation.macroenabled
              - org.openxmlformats.presentationml.slideshow
              - com.microsoft.powerpoint.pps
              - com.microsoft.powerpoint.pot
              - com.apple.iwork.keynote.sffkey
              - com.apple.iwork.keynote.key
          - CFBundleTypeName: Tactile Texts Backup
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - software.tactile.texts.backup
        # Types the system may not declare. The iWork package types and Markdown are Apple's and
        # usually present; declaring them makes a `.pages`/`.key` folder a document even on a
        # device without Pages or Keynote. The `software.tactile.texts.*` types exist so the
        # Files picker and drops can offer comics, and the formats the app names when it turns
        # them down (Kindle, DjVu, CBR). The identifiers and their extensions are
        # `ImportFormatCatalog.declaredTypes` in Packages/ReaderCore (checked by the same test).
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: software.tactile.texts.cbz
            UTTypeDescription: Comic Book Archive
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
              public.mime-type: [application/vnd.comicbook+zip]
          - UTTypeIdentifier: software.tactile.texts.cbr
            UTTypeDescription: Comic Book Archive (RAR)
            UTTypeConformsTo: [public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cbr]
              public.mime-type: [application/vnd.comicbook-rar]
          - UTTypeIdentifier: software.tactile.texts.kindle-book
            UTTypeDescription: Kindle Book
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mobi, azw, azw3, azw4, kfx, prc]
              public.mime-type: [application/x-mobipocket-ebook]
          - UTTypeIdentifier: software.tactile.texts.djvu
            UTTypeDescription: DjVu Document
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [djvu, djv]
              public.mime-type: [image/vnd.djvu]
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd]
              public.mime-type: [text/markdown]
          - UTTypeIdentifier: com.apple.iwork.pages.pages
            UTTypeDescription: Pages Document
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [pages]
          - UTTypeIdentifier: com.apple.iwork.keynote.key
            UTTypeDescription: Keynote Presentation
            UTTypeConformsTo: [com.apple.package, public.presentation]
            UTTypeTagSpecification:
              public.filename-extension: [key]
        # A backup archive (`.ttbackup`): a ZIP by content, declared as plain data so Files hands
        # it to the app instead of unpacking it. Same identifier and extension as
        # `BackupFormat` in Packages/ReaderBackup.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: software.tactile.texts.backup
            UTTypeDescription: Tactile Texts Backup
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ttbackup
        # Automatic backups run in a background processing task.
        # Marked-up PDF exports keep running in a continued processing task (iPadOS 26+), one
        # identifier per export (`MarkedUpExportBackgroundRun.continuedTaskPrefix`).
        BGTaskSchedulerPermittedIdentifiers:
          - software.tactile.texts.backup
          - software.tactile.texts.export.*
        UIBackgroundModes:
          - processing
        # The developer's S3-compatible backup destination (for example Cloudflare R2); every
        # value is empty when not set up. These are build-time secrets from the git-ignored
        # Config/Local.xcconfig and are readable in the built app: see Config/Signing.xcconfig.
        S3Backup:
          Host: $(S3_BACKUP_HOST)
          Region: $(S3_BACKUP_REGION)
          Bucket: $(S3_BACKUP_BUCKET)
          AccessKeyID: $(S3_BACKUP_ACCESS_KEY_ID)
          SecretAccessKey: $(S3_BACKUP_SECRET_ACCESS_KEY)
          Prefix: $(S3_BACKUP_PREFIX)
          DisplayName: $(S3_BACKUP_NAME)
        # The Tactile Texts cloud backup service: its host (no scheme) and the App Store
        # subscription product IDs, comma-separated. Not secrets. Both empty by default, which
        # leaves the service out of the app; see Config/Signing.xcconfig. AttestBypass is for
        # development builds against the `dev` Worker only (debug builds read it).
        BackupService:
          Host: $(BACKUP_SERVICE_HOST)
          ProductIDs: $(BACKUP_PRODUCT_IDS)
          AttestBypass: $(BACKUP_SERVICE_ATTEST_BYPASS)
          # The subscription's Terms of Use and Privacy Policy, shown on the offer; written
          # without "https://" in an xcconfig. Empty by default: that link is not shown.
          TermsURL: $(BACKUP_TERMS_URL)
          PrivacyURL: $(BACKUP_PRIVACY_URL)
  TactileTextsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      # The StoreKit configuration, for the tests' SKTestSession (not shipped in the app).
      - path: Config/TactileTexts.storekit
        buildPhase: resources
    dependencies:
      - target: TactileTexts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.tactile.texts.tests
  TactileTextsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: TactileTexts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.tactile.texts.uitests
schemes:
  TactileTexts:
    build:
      targets:
        TactileTexts: all
    # Purchases in a Run from Xcode use the local StoreKit configuration, so the backup
    # subscription can be bought in the simulator with no App Store account.
    run:
      storeKitConfiguration: Config/TactileTexts.storekit
    test:
      targets:
        - TactileTextsTests
        - TactileTextsUITests
